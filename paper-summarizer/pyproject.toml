[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent"
version = "0.1.0"
description = "Research Paper Summarizer Agent: the 4-day workshop codebase"
requires-python = ">=3.11"   # Docker uses 3.11; Colab runs a newer Python
# Direct dependencies only, with ranges wide enough for Colab's preinstalled packages.
# Exact pins for Docker live in requirements.lock / requirements-dev.lock (`make lock`).
dependencies = [
    "requests>=2.31",    # all model calls: OpenRouter's HTTP API, no SDK
    "pydantic>=2.7",
    "tiktoken",
    "numpy",
]

[project.optional-dependencies]
rag = [                          # Day 2
    "pdfplumber>=0.11",          # MIT; gives per-character font/colour, used for hidden-text checks
    "pypdf>=6",                  # BSD; the Day 2 code-along parser (participants install only this)
    "langchain-text-splitters>=0.3",
    "chromadb>=1.0",
]
agent = [                        # Day 3 (also in the runtime image: the Day 4 api service runs the agent)
    "langchain>=1.4.3,<1.5",     # create_agent, middleware (ToolErrorMiddleware needs a recent 1.x)
    "langchain-core>=1.6.7,<1.7",
    "langgraph>=1.2.14,<1.3",
    "langchain-openai>=1.6.7,<1.7",
]
mock = [                         # mock-llm server (and the Day 4 api service)
    "fastapi",
    "uvicorn",
]
serve = [                        # Day 4: the api service (also in the runtime image)
    "litellm==1.104.2",          # Router (library mode); the proxy runs as its own image
    "langchain-litellm==0.11.0",
    "fastapi==0.142.4",          # ships its own OpenTelemetry request spans (fastapi/telemetry)
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",  # UploadFile
    "httpx==0.28.1",
    "opentelemetry-sdk==1.45.1",
    "reportlab==5.0.1",          # Day 4 cell 4.0 draws the TinyCoder PDF
]
dev = [
    "paper-agent[rag,mock,agent,serve]",
    "pytest",
    "ruff",
    "openai",       # tests only: proves mock-llm stays OpenAI-compatible (the LiteLLM gateway relies on it)
    "ipykernel",    # a kernel for tools/exec_notebooks.py (no Jupyter server: notebooks run in Colab)
    "nbclient",     # tools/exec_notebooks.py
    "jupyter-server",   # `make demo`: a kernel VS Code connects to, inside the Docker network (Day 4 demo)
    "nbformat",
]

[tool.setuptools.packages.find]
include = ["paper_agent*", "mock_llm*"]

[tool.setuptools.package-data]
paper_agent = ["prompts/*.txt", "fixtures/pdfs/*.pdf", "data/*.json", "evals/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not gateway'"      # `make test-gateway` runs the proxy-mode tests (-m gateway)
markers = ["gateway: needs the LiteLLM proxy stack: gateway + postgres + redis + api (make test-gateway)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", "data", "logs", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E701",    # `for x in y: print(x)` one-liners, kept from the Day 1 notebook
    "UP007",   # Optional[X] kept as written in the Day 1 notebook
    "UP045",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Ported verbatim from the Day 1 notebook; drift tests compare them with the notebook text.
"paper_agent/llm_client.py" = ["UP006", "UP035"]
"paper_agent/fixtures/tinycoder.py" = ["E501"]
"paper_agent/explain.py" = ["E501"]
"paper_agent/rag/pdf_rag.py" = ["E501"]   # the TODO answer-key lines stay one line: they are typed live
"paper_agent/agent/prompts.py" = ["E501"]   # the system prompt: one rule per line, as the model reads it
# Notebook text (markdown tables, cell code) is laid out for the rendered notebook, not for 120 columns.
"notebook_templates/*" = ["E501"]
"tools/sync_day1_llm_client.py" = ["E501"]   # holds verbatim lines of llm_client.py
